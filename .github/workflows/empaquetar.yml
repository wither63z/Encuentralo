# Compila la APK (Android) y el .exe (Windows) en GitHub, sin instalar el SDK de Android en cada PC.
# Se ejecuta en cada push a main o a mano (pestaña Actions → Empaquetar → Run workflow).
# Los archivos quedan como "Artifacts" del run para descargarlos.
name: Empaquetar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run typecheck && npm run verificar && npm test
      - run: npm run apk:preparar
      - name: Compilar APK de prueba (debug)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Encuentralo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run exe
      - uses: actions/upload-artifact@v4
        with:
          name: Encuentralo-exe
          path: release/*.exe
