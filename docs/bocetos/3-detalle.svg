<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 700" width="360" height="700"><rect width="360" height="700" fill="#ffffff"/><rect x="0" y="0" width="360" height="56" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><rect x="16" y="12" width="32" height="32" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="58" y="34" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="start">Encuéntralo</text><text x="344" y="34" font-family="Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="end"></text><text x="16" y="88" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#1d4ed8" text-anchor="start">← Volver al listado</text><rect x="16" y="104" width="120" height="120" rx="16" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="76" y="170" font-family="Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="middle">Foto o ícono</text><text x="150" y="130" font-family="Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#334155" text-anchor="start">Chompa azul con capucha</text><rect x="150" y="142" width="90" height="22" rx="11" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="195" y="158" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Disponible</text><text x="16" y="260" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="start">Categoría:</text><rect x="120" y="252" width="200" height="8" rx="4" fill="#e2e8f0"/><text x="16" y="294" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="start">Lugar:</text><rect x="120" y="286" width="200" height="8" rx="4" fill="#e2e8f0"/><text x="16" y="328" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="start">Fecha:</text><rect x="120" y="320" width="200" height="8" rx=